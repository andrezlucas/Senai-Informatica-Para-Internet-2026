<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="img/senai-logo.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Inscrição | SENAI</title>

    <style>
        body {
            background-color: rgba(216, 7, 7, 0.507);
        }

        .logo {
            height: 89px;
        }

        fieldset {
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            background-color: #fff;
        }

        legend {
            float: none;
            width: auto;
            padding: 0 10px;
            font-weight: bold;
            color: #dc3545;
        }
    </style>
</head>

<body>

    <!-- CONTAINER PRINCIPAL -->
    <div class="container my-4">

        <!-- CABEÇALHO -->
        <header class="bg-white rounded shadow p-3 mb-4">

            <div class="row align-items-center">

                <!-- LOGO -->
                <div class="col-md-3 text-center text-md-start">
                    <a href="index.html">
                        <img src="img/senai-logo.png" class="logo img-fluid" alt="Logo SENAI">
                    </a>
                </div>

                <!-- MENU -->
                <div class="col-md-9">

                    <nav class="nav justify-content-center justify-content-md-end">

                        <a class="nav-link fw-bold text-dark" href="index.html">
                            HOME
                        </a>

                        <a class="nav-link fw-bold text-dark" href="quemsomos.html">
                            QUEM SOMOS
                        </a>

                        <a class="nav-link fw-bold text-dark" href="contatos.html">
                            CONTATOS
                        </a>

                        <a class="nav-link fw-bold text-dark" href="login.html">
                            LOGIN
                        </a>

                        <a class="nav-link fw-bold text-danger" href="inscricao.html">
                            INSCRIÇÃO
                        </a>

                    </nav>

                </div>

            </div>

        </header>


        <!-- TÍTULO -->
        <div class="text-center text-white mb-4">
            <h1>Ficha de Inscrição</h1>
            <p>Preencha todos os dados para realizar sua matrícula.</p>
        </div>


        <!-- FORMULÁRIO -->
        <form action="" method="post" enctype="multipart/form-data">


            <!-- DADOS PESSOAIS -->
            <fieldset class="mb-4">

                <legend>DADOS PESSOAIS</legend>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="nome" class="form-label">
                            Nome:
                        </label>

                        <input type="text" id="nome" name="nome" class="form-control" placeholder="Nome completo"
                            required minlength="6">
                    </div>


                    <div class="col-md-6">
                        <label for="cpf" class="form-label">
                            CPF:
                        </label>

                        <input type="text" id="cpf" name="cpf" class="form-control" placeholder="000.000.000-00"
                            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" maxlength="14" required>
                    </div>


                    <div class="col-md-4">
                        <label for="nascimento" class="form-label">
                            Data de nascimento:
                        </label>

                        <input type="date" id="nascimento" name="nascimento" class="form-control" required>
                    </div>


                    <div class="col-md-4">
                        <label for="sexo" class="form-label">
                            Sexo:
                        </label>

                        <select name="sexo" id="sexo" class="form-select" required>

                            <option value="">Selecione um gênero</option>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>

                        </select>
                    </div>


                    <div class="col-md-4">
                        <label for="estadocivil" class="form-label">
                            Estado Civil:
                        </label>

                        <select name="estadocivil" id="estadocivil" class="form-select">

                            <option value="">Selecione seu estado civil</option>
                            <option value="solteiro">Solteiro(a)</option>
                            <option value="casado">Casado(a)</option>
                            <option value="separado">Separado(a)</option>
                            <option value="divorciado">Divorciado(a)</option>
                            <option value="viuvo">Viúvo(a)</option>

                        </select>
                    </div>


                    <div class="col-md-6">
                        <label for="mae" class="form-label">
                            Nome da mãe:
                        </label>

                        <input type="text" id="mae" name="mae" class="form-control" placeholder="Nome completo"
                            required>
                    </div>


                    <div class="col-md-6">
                        <label for="responsavel" class="form-label">
                            Nome do responsável:
                        </label>

                        <input type="text" id="responsavel" name="responsavel" class="form-control"
                            placeholder="Nome completo">
                    </div>

                </div>

            </fieldset>


            <!-- DADOS DE CONTATO -->
            <fieldset class="mb-4">

                <legend>DADOS DE CONTATO</legend>

                <div class="row g-3">

                    <div class="col-md-6">

                        <label for="email" class="form-label">
                            E-mail:
                        </label>

                        <input type="email" id="email" name="email" class="form-control" placeholder="exemplo@gmail.com"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label for="telefone" class="form-label">
                            Número de Telefone:
                        </label>

                        <input type="tel" id="telefone" name="telefone" class="form-control"
                            placeholder="Ex: 81900000000" pattern="[1-9]{2}9[0-9]{8}" maxlength="11" minlength="11"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label for="celular" class="form-label">
                            Número de Celular:
                        </label>

                        <input type="tel" id="celular" name="celular" class="form-control" placeholder="Ex: 81900000000"
                            pattern="[1-9]{2}9[0-9]{8}" maxlength="11" minlength="11" required>

                    </div>


                    <div class="col-md-6">

                        <label for="whatsapp" class="form-label">
                            Número de Whatsapp:
                        </label>

                        <input type="tel" id="whatsapp" name="whatsapp" class="form-control"
                            placeholder="Ex: 81900000000" pattern="[1-9]{2}9[0-9]{8}" maxlength="11" minlength="11">

                    </div>

                </div>

            </fieldset>


            <!-- ENDEREÇO -->
            <fieldset class="mb-4">

                <legend>ENDEREÇO</legend>

                <div class="row g-3">

                    <div class="col-md-4">

                        <label for="cep" class="form-label">
                            CEP:
                        </label>

                        <input type="text" id="cep" name="cep" class="form-control" placeholder="Digite seu CEP"
                            pattern="\d{5}-?\d{3}" required>

                    </div>


                    <div class="col-md-4">

                        <label for="estado" class="form-label">
                            Estado:
                        </label>

                        <select name="estado" id="estado" class="form-select" required>

                            <option value="">Selecione o estado</option>
                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PA">Pará</option>
                            <option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="SP">São Paulo</option>
                            <option value="SE">Sergipe</option>
                            <option value="TO">Tocantins</option>

                        </select>

                    </div>


                    <div class="col-md-4">

                        <label for="cidade" class="form-label">
                            Cidade:
                        </label>

                        <input type="text" id="cidade" name="cidade" class="form-control" placeholder="Nome da Cidade"
                            maxlength="100" required>

                    </div>


                    <div class="col-md-6">

                        <label for="bairro" class="form-label">
                            Bairro:
                        </label>

                        <input type="text" id="bairro" name="bairro" class="form-control" placeholder="Nome do bairro"
                            maxlength="100" required>

                    </div>


                    <div class="col-md-6">

                        <label for="rua" class="form-label">
                            Rua:
                        </label>

                        <input type="text" id="rua" name="rua" class="form-control" placeholder="Nome da rua"
                            maxlength="100" required>

                    </div>


                    <div class="col-md-6">

                        <label for="numero_da_residencia" class="form-label">
                            Número da residência:
                        </label>

                        <input type="text" id="numero_da_residencia" name="numero_da_residencia" class="form-control"
                            placeholder="Número da residência" maxlength="50" required>

                    </div>


                    <div class="col-md-6">

                        <label for="complemento" class="form-label">
                            Complemento:
                        </label>

                        <input type="text" id="complemento" name="complemento" class="form-control"
                            placeholder="Complemento" maxlength="100">

                    </div>

                </div>

            </fieldset>


            <!-- INFORMAÇÕES ACADÊMICAS -->
            <fieldset class="mb-4">

                <legend>INFORMAÇÕES ACADÊMICAS</legend>

                <div class="row g-3">

                    <div class="col-md-6">

                        <label for="curso" class="form-label">
                            Curso pretendido:
                        </label>

                        <select name="curso" id="curso" class="form-select" required>

                            <option value="">Selecione o curso</option>
                            <option value="desenvolvimento_sistemas">
                                Desenvolvimento de Sistemas
                            </option>
                            <option value="mecatronica">
                                Mecatrônica
                            </option>
                            <option value="eletrotecnica">
                                Eletrotécnica
                            </option>
                            <option value="administracao">
                                Administração
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label for="turno" class="form-label">
                            Turno:
                        </label>

                        <select name="turno" id="turno" class="form-select" required>

                            <option value="">Selecione o turno</option>
                            <option value="manha">Manhã</option>
                            <option value="tarde">Tarde</option>
                            <option value="noite">Noite</option>

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label for="modalidade" class="form-label">
                            Modalidade de ensino:
                        </label>

                        <select name="modalidade" id="modalidade" class="form-select" required>

                            <option value="">Selecione a modalidade</option>
                            <option value="presencial">Presencial</option>
                            <option value="semipresencial">Semipresencial</option>
                            <option value="ead">EAD</option>

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label for="forma_ingresso" class="form-label">
                            Forma de ingresso:
                        </label>

                        <select name="forma_ingresso" id="forma_ingresso" class="form-select" required>

                            <option value="">
                                Selecione a forma de ingresso
                            </option>

                            <option value="processo_seletivo">
                                Processo seletivo
                            </option>

                            <option value="vestibular">
                                Vestibular
                            </option>

                            <option value="transferencia">
                                Transferência
                            </option>

                            <option value="reingresso">
                                Reingresso
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label for="ano_semestre" class="form-label">
                            Ano/Semestre de ingresso:
                        </label>

                        <input type="text" id="ano_semestre" name="ano_semestre" class="form-control"
                            placeholder="Ex: 2026/1" pattern="[0-9]{4}/[1-2]" required>

                    </div>

                </div>

            </fieldset>


            <!-- INFORMAÇÕES ADICIONAIS -->
            <fieldset class="mb-4">

                <legend>INFORMAÇÕES ADICIONAIS</legend>

                <div class="row g-3">

                    <div class="col-12">

                        <label class="form-label">
                            Possui algum conhecimento prévio na área?
                        </label>

                        <div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input" type="radio" id="conhecimento_sim"
                                    name="conhecimento_previo" value="sim" required>

                                <label class="form-check-label" for="conhecimento_sim">
                                    Sim
                                </label>

                            </div>


                            <div class="form-check form-check-inline">

                                <input class="form-check-input" type="radio" id="conhecimento_nao"
                                    name="conhecimento_previo" value="nao" required>

                                <label class="form-check-label" for="conhecimento_nao">
                                    Não
                                </label>

                            </div>

                        </div>

                    </div>


                    <div class="col-md-6">

                        <label for="como_conheceu" class="form-label">
                            Como conheceu a instituição?
                        </label>

                        <select name="como_conheceu" id="como_conheceu" class="form-select" required>

                            <option value="">
                                Selecione uma opção
                            </option>

                            <option value="indicacao">
                                Indicação de amigos/família
                            </option>

                            <option value="redes_sociais">
                                Redes sociais
                            </option>

                            <option value="site">
                                Site da instituição
                            </option>

                            <option value="evento">
                                Evento/feira
                            </option>

                            <option value="outro">
                                Outro
                            </option>

                        </select>

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            Possui necessidades de atendimento específico?
                        </label>

                        <div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input" type="radio" id="atendimento_sim"
                                    name="atendimento_especifico" value="sim" required>

                                <label class="form-check-label" for="atendimento_sim">
                                    Sim
                                </label>

                            </div>


                            <div class="form-check form-check-inline">

                                <input class="form-check-input" type="radio" id="atendimento_nao"
                                    name="atendimento_especifico" value="nao" required>

                                <label class="form-check-label" for="atendimento_nao">
                                    Não
                                </label>

                            </div>

                        </div>

                    </div>


                    <div class="col-12">

                        <label for="observacoes" class="form-label">
                            Observações adicionais:
                        </label>

                        <textarea id="observacoes" name="observacoes" class="form-control" rows="4" maxlength="500"
                            placeholder="Digite aqui suas observações (opcional)"></textarea>

                    </div>

                </div>

            </fieldset>


            <!-- ENVIO DE DOCUMENTOS -->
            <fieldset class="mb-4">

                <legend>ENVIO DE DOCUMENTOS</legend>

                <div class="row g-3">

                    <div class="col-md-6">

                        <label for="foto" class="form-label">
                            Foto 3x4:
                        </label>

                        <input type="file" id="foto" name="foto" class="form-control"
                            accept="image/png, image/jpeg, .pdf" required>

                    </div>


                    <div class="col-md-6">

                        <label for="documento_identificacao" class="form-label">
                            Documento de identificação:
                        </label>

                        <input type="file" id="documento_identificacao" name="documento_identificacao"
                            class="form-control" accept="image/png, image/jpeg,.pdf" required>

                    </div>


                    <div class="col-md-6">

                        <label for="cpf_arquivo" class="form-label">
                            CPF:
                        </label>

                        <input type="file" id="cpf_arquivo" name="cpf_arquivo" class="form-control"
                            accept="image/png, image/jpeg,.pdf" required>

                    </div>


                    <div class="col-md-6">

                        <label for="comprovante_residencia" class="form-label">
                            Comprovante de residência:
                        </label>

                        <input type="file" id="comprovante_residencia" name="comprovante_residencia"
                            class="form-control" accept="image/png, image/jpeg,.pdf" required>

                    </div>


                    <div class="col-md-6">

                        <label for="certificado_escolar" class="form-label">
                            Certificado ou declaração escolar:
                        </label>

                        <input type="file" id="certificado_escolar" name="certificado_escolar" class="form-control"
                            accept="image/png, image/jpeg,.pdf" required>

                    </div>


                    <div class="col-md-6">

                        <label for="outros_documentos" class="form-label">
                            Outros documentos:
                        </label>

                        <input type="file" id="outros_documentos" name="outros_documentos" class="form-control"
                            accept="image/png, image/jpeg,.pdf" multiple>

                    </div>

                </div>

            </fieldset>


            <!-- TERMOS -->
            <fieldset class="mb-4">

                <legend>TERMOS E DECLARAÇÕES</legend>

                <div class="form-check mb-3">

                    <input class="form-check-input" type="checkbox" id="declara_verdadeiro" name="declara_verdadeiro"
                        value="sim" required>

                    <label class="form-check-label" for="declara_verdadeiro">
                        Confirmo que as informações fornecidas são verdadeiras
                    </label>

                </div>


                <div class="form-check mb-3">

                    <input class="form-check-input" type="checkbox" id="aceita_termos" name="aceita_termos" value="sim"
                        required>

                    <label class="form-check-label" for="aceita_termos">
                        Concordo com os termos da instituição
                    </label>

                </div>


                <div class="form-check mb-3">

                    <input class="form-check-input" type="checkbox" id="autoriza_dados" name="autoriza_dados"
                        value="sim" required>

                    <label class="form-check-label" for="autoriza_dados">
                        Autorizo o tratamento dos meus dados para fins da matrícula
                    </label>

                </div>


                <div class="form-check">

                    <input class="form-check-input" type="checkbox" id="aceita_comunicacoes" name="aceita_comunicacoes"
                        value="sim">

                    <label class="form-check-label" for="aceita_comunicacoes">
                        Desejo receber comunicações da instituição
                    </label>

                </div>

            </fieldset>


            <!-- FINALIZAÇÃO -->
            <fieldset class="mb-4">

                <legend>FINALIZAÇÃO</legend>

                <div class="text-center">

                    <button type="submit" class="btn btn-danger btn-lg me-2">
                        Enviar matrícula
                    </button>

                    <button type="reset" class="btn btn-secondary btn-lg">
                        Limpar formulário
                    </button>

                </div>

            </fieldset>

        </form>


        <!-- RODAPÉ -->
        <footer class="bg-white rounded shadow text-center p-3">

            <h6 class="mb-0">
                &copy; Todos os Direitos Reservados
            </h6>

        </footer>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
